<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library </title>
    <link href="styles.css" rel="stylesheet" />
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1> Library </h1>
        </div>
        <div class="books">
            <div class="card">
                
            </div>
            
        </div>
        <div class="new-book">
            <button command="show-modal" commandfor="newBook" type="button"> New Book</button>
        </div>

        <dialog id="newBook">
            <div class="newBookModal" id="newBookModal">
                <div class="modal-content">
                    <div class="close-button-container">
                        <button type="button" class="close-button" commandfor="newBook" command="close"> &times;</button>
                    </div>
                </div>
                <form method="newBook">
                    <label for="tile"> Title of the Book: </label>
                    <input type="text" id="title" name="title"><br />
                    <label for="author"> Author of the Book:</label>                    
                    <input type="text" id="author" name="author"><br />
                    <label for="date"> Date Published </label>
                    <input type="date" id="date" name="date"><br />
                    <input type="submit" id="addBook" value="Add Book" >
                </form>
            </div>
        </dialog>
       
        </div>
    </div>

</body>
</html>
